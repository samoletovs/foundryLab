name: Model migration validation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared test dependencies
        run: python -m pip install "azure-identity>=1.19.0" "azure-ai-projects>=2.1.0,<3" "openai>=2.0" "python-dotenv>=1.0.1" "pytest>=8.3.0" "ruff>=0.7.0"
      - name: Test synthetic evaluator and lab-memory agent without provider calls
        run: python -m pytest tests/test_model_refresh_eval.py tests/test_lab_memory_agent.py -q
      - name: Lint evaluation code
        run: python -m ruff check scripts/evaluate_model_refresh.py tests/ agents/labMemoryAgent/ --isolated --select E9,F
      - name: Validate model infrastructure
        run: |
          az bicep build --file shared/infrastructure/main.bicep --outfile /tmp/foundry-models.json
          az bicep build-params --file shared/infrastructure/main.bicepparam --outfile /tmp/foundry-parameters.json
          python -c "import json; p=json.load(open('/tmp/foundry-parameters.json'))['parameters']; assert p['chatModelName']['value']=='gpt-6-luna'; assert p['chatModelVersion']['value']=='2026-09-22'; assert p['chatModelCapacity']['value']==100; assert p['premiumChatModelName']['value']=='gpt-6-sol'; assert p['transcriptionModelVersion']['value']=='2025-12-15'"
