name: Model migration validation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: model-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install declared test dependencies
        run: python -m pip install "azure-identity>=1.19.0" "openai>=1.55.0" "pytest>=8.3.0" "ruff>=0.7.0"
      - name: Test synthetic evaluator without provider calls
        run: python -m pytest tests/test_model_refresh_eval.py -q
      - name: Lint evaluation code
        run: python -m ruff check scripts/evaluate_model_refresh.py tests/test_model_refresh_eval.py --isolated --select E9,F
      - name: Validate model infrastructure
        run: az bicep build --file shared/infrastructure/main.bicep --outfile /tmp/foundry-models.json
